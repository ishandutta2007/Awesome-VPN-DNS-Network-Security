<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>

    <!-- Drop Shadows and Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .gradient-title {
        fill: url(#accentGrad);
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 16px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #38bdf8;
      }
      
      /* Background dynamic animations behind foreground */
      @keyframes pulseRing {
        0% { transform: scale(0.95); opacity: 0.25; }
        50% { transform: scale(1.05); opacity: 0.6; }
        100% { transform: scale(0.95); opacity: 0.25; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }

      .pulse-circle {
        transform-origin: 1060px 170px;
        animation: pulseRing 5s ease-in-out infinite;
      }
      .data-stream {
        stroke-dasharray: 8, 12;
        animation: dashMove 3s linear infinite;
      }
      .stream-rev {
        stroke-dasharray: 6, 10;
        animation: dashMove 4s linear infinite reverse;
      }
      .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 8s ease-in-out infinite 1s; }
      .particle-3 { animation: floatParticle 7s ease-in-out infinite 2s; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Subtle Cyber Security Grid -->
  <g opacity="0.12">
    <line x1="0" y1="68" x2="1200" y2="68" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,8" />
    <line x1="0" y1="136" x2="1200" y2="136" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,8" />
    <line x1="0" y1="204" x2="1200" y2="204" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,8" />
    <line x1="0" y1="272" x2="1200" y2="272" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,8" />
    <line x1="240" y1="0" x2="240" y2="340" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,8" />
    <line x1="480" y1="0" x2="480" y2="340" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,8" />
    <line x1="720" y1="0" x2="720" y2="340" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,8" />
    <line x1="960" y1="0" x2="960" y2="340" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,8" />
  </g>

  <!-- Dynamic Background Network & Topology Nodes (Kept behind foreground text) -->
  <g class="pulse-circle">
    <circle cx="1060" cy="170" r="120" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.3" />
    <circle cx="1060" cy="170" r="85" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6,6" />
    <circle cx="1060" cy="170" r="45" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.5" />
  </g>

  <!-- Tunnel / Packet Streams in Right Background -->
  <path d="M880 70 Q980 120 1060 170 T1180 270" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.4" class="data-stream" />
  <path d="M840 250 Q960 210 1060 170 T1160 80" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.35" class="stream-rev" />
  <path d="M780 170 L1060 170" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.3" class="data-stream" />

  <!-- Decorative Orbit Nodes -->
  <circle cx="960" cy="120" r="5" fill="#38bdf8" class="particle-1" filter="url(#glow)" />
  <circle cx="1060" cy="85" r="4" fill="#818cf8" class="particle-2" filter="url(#glow)" />
  <circle cx="1130" cy="220" r="6" fill="#c084fc" class="particle-3" filter="url(#glow)" />
  <circle cx="1060" cy="170" r="12" fill="#38bdf8" opacity="0.9" filter="url(#glow)" />
  
  <!-- Shield Icon Graphic in Background Node -->
  <path d="M1054 162 L1060 159 L1066 162 V168 C1066 172 1063 175 1060 177 C1057 175 1054 172 1054 168 Z" fill="#ffffff" opacity="0.9" />

  <!-- Left Accent Tech Pillar -->
  <rect x="50" y="55" width="4" height="230" rx="2" fill="url(#accentGrad)" />

  <!-- Badges / Tags on top left -->
  <g transform="translate(70, 60)">
    <rect width="170" height="28" rx="14" fill="#0369a1" fill-opacity="0.2" stroke="#0284c7" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#38bdf8" />
    <text x="28" y="19" class="tag-text">DNS &amp; VPN SECURITY</text>
  </g>
  <g transform="translate(250, 60)">
    <rect width="175" height="28" rx="14" fill="#4338ca" fill-opacity="0.2" stroke="#6366f1" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#818cf8" />
    <text x="28" y="19" class="tag-text" fill="#a5b4fc">OPEN SOURCE &amp; SAAS</text>
  </g>

  <!-- Foreground Title and Headline (High contrast, clearly in foreground) -->
  <text x="70" y="135" class="title-text">
    Awesome <tspan class="gradient-title">VPN, DNS &amp; Network Security</tspan>
  </text>

  <!-- Subtitle -->
  <text x="70" y="178" class="subtitle-text">
    Curated Hub of SaaS Gateways, Encrypted DNS Resolvers, Mesh VPNs &amp; Censorship-Resistant Tunnels
  </text>

  <!-- Key Feature Pills / Highlights -->
  <g transform="translate(70, 215)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="14" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🛡️ DoH / DoT / DoQ</text>

    <!-- Pill 2 -->
    <rect x="142" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="156" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ WireGuard &amp; Mesh</text>

    <!-- Pill 3 -->
    <rect x="299" y="0" width="155" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="313" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🌐 DNS Tunneling</text>

    <!-- Pill 4 -->
    <rect x="466" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="480" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🚫 Ad &amp; Threat Blocker</text>
  </g>

  <!-- Bottom subtle telemetry info -->
  <text x="70" y="278" font-family="monospace" font-size="12" fill="#64748b">
    PROTOCOL STACK: [DNS-over-HTTPS | DNS-over-QUIC | WireGuard | Noise Protocol | Zero Trust ZTNA]
  </text>
</svg>